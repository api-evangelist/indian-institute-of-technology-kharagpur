  - name: IIT Kharagpur Institutional Digital Repository OpenSearch interface
    url: http://www.idr.iitkgp.ac.in/xmlui/open-search/discover
    x-operator: institution
    versioning: >-
      None assigned by the institution. The protocol is OpenSearch 1.1 (namespace
      http://a9.com/-/spec/opensearch/1.1/, read from the live feed) and the software is DSpace
      6.0 (read from the Generator meta tag on /xmlui/). DSpace 6.0 reached end of support in
      2023; DSpace 7 replaced the XMLUI with an Angular UI and a REST API, neither of which is
      deployed here. There is no versioned base path and no version header.
    change_signal: >-
      Atom <updated>/<published> per item, plus /xmlui/feed/{rss_1.0,rss_2.0,atom_1.0}/site and
      /xmlui/recent-submissions. No deleted-record semantics are available, because no OAI-PMH
      provider is deployed — a consumer cannot learn that an item was withdrawn.
    deprecation_policy: none published
    status_page: none found
    transport_risk: >-
      HTTP only. https://www.idr.iitkgp.ac.in does not complete a TLS handshake, and the bare
      host idr.iitkgp.ac.in does not resolve. Any future move to HTTPS or to DSpace 7 will break
      every stored URL, and the identifiers the repository itself emits (http://127.0.0.1/xmlui/...)
      are already broken.
