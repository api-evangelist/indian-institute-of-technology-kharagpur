apis:
  - aid: indian-institute-of-technology-kharagpur:idr-opensearch
    name: IIT Kharagpur Institutional Digital Repository OpenSearch Interface
    x-operator: institution
    description: >-
      OpenSearch 1.1 query interface over the Central Library's Institutional Digital Repository,
      running DSpace 6.0 self-hosted on the institute's own www.idr.iitkgp.ac.in. Verified live
      2026-09-01 — /xmlui/open-search/description.xml returns a 603-byte description document
      naming LongName "Central Library IIT Kharagpur" and Contact dspace-help@library.iitkgp.ac.in,
      an institution address on the institution's own domain, and /xmlui/open-search/discover
      returns an Atom 1.0 feed carrying the opensearch: and dc: namespaces. The repository holds
      8,162 items; query, format, start, rpp, sort_by, order and scope were each exercised and
      confirmed. DSpace is open-source software the institute installs and runs itself, not a
      vendor tenancy, so the host, the contact, the identifiers and the content are all IIT
      Kharagpur's — but the software is shared by thousands of deployments, so the OpenAPI stored
      here is a derived description of THIS deployment's observed behaviour, not a DSpace product
      contract. Three defects are recorded rather than smoothed over: the host has no TLS listener
      (https:// fails, idr.iitkgp.ac.in does not resolve), every <id> and <link> in the feed is
      emitted with the authority http://127.0.0.1, and the handle prefix is the DSpace installation
      default 123456789, so no item carries a persistent identifier. No OAI-PMH provider, DSpace
      REST API or SWORD service document is deployed — the nginx front end proxies only /xmlui.
