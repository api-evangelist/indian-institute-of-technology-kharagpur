aid: indian-institute-of-technology-kharagpur
name: Indian Institute of Technology Kharagpur
description: >-
  Indian Institute of Technology Kharagpur (IIT Kharagpur / IIT KGP) is a public
  technical and research university in West Bengal, India, and the first of the
  IITs, ranked #222 in the QS World University Rankings 2025. Its public digital
  footprint centers on machine-readable scholarly infrastructure rather than a
  formal developer program: the Central Library operates a DSpace-based
  Institutional Digital Repository (the first IR among the IITs) and the
  institute maintains an IRINS research-profile portal hosted by INFLIBNET that
  ingests data from ORCID, Scopus, and Crossref. Operational systems such as the
  ERP/SSO platform are gated to enrolled members and expose no public API
  documentation. No official institution-wide developer portal was found; this
  profile catalogs the publicly reachable, standards-based endpoints only.
