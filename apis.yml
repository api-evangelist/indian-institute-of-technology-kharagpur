aid: indian-institute-of-technology-kharagpur
name: Indian Institute of Technology Kharagpur
x-type: university
x-category: Institute of Technology
description: >-
  Indian Institute of Technology Kharagpur (IIT KGP) is an Institute of National Importance in
  West Bengal, India — the first of the IITs, founded 1951, and ranked #222 in the QS World
  University Rankings 2025. It runs no developer portal, publishes no OpenAPI and issues no API
  keys, and this profile does not pretend otherwise. What it does operate, on its own iitkgp.ac.in
  hosts, are two unauthenticated machine surfaces found by probing rather than by documentation.
  The Central Library's Institutional Digital Repository (DSpace 6.0, 8,162 items, the first IR
  among the IITs) exposes an OpenSearch 1.1 description document and an Atom query endpoint at
  www.idr.iitkgp.ac.in/xmlui — served over plain HTTP only, with every identifier in the feed
  emitted as http://127.0.0.1/xmlui because dspace.baseUrl is misconfigured, and with no OAI-PMH
  provider, no DSpace REST API and no registered Handle prefix. The institute's own ERP exposes a
  single public JAX-RS resource, /InfoCellDetails/resources/external/cepdata, which returns the
  brochure PDF for any Continuing Education Programme course by structured course_id; the institute
  homepage links it two hundred times, and it is the only endpoint on the estate that IIT Kharagpur
  itself wrote and left open. Everything else is gated or leased: the ERP behind a bespoke session
  SSO whose JAX-RS WADL 302s to a login page, the PARAM Shakti HPC allocation system behind its own
  login, the IRINS research-profile portal a tenant deployment on INFLIBNET's Cloudflare-fronted
  platform, and the alumni network a tenant on AlmaConnect. No Shibboleth or SAML identity provider
  for iitkgp.ac.in exists anywhere in eduGAIN, including in India's own INFED federation where peer
  IITs are registered; the institute is not a DataCite or Crossref member and mints no DOIs. Its one
  verifiable registry membership is ROR 03w5sq511. The institute website itself returns HTTP 200 with
  an Angular shell for /llms.txt, /.well-known/security.txt and /sitemap.xml alike, so none of those
  exist either.
