    name: IIT Kharagpur IRINS Research Profile Portal (INFLIBNET tenant)
    x-operator: tenant
    description: >-
      Indian Research Information Network System (IRINS) research-profile portal for IIT Kharagpur,
      operated by INFLIBNET — an autonomous inter-university centre of the UGC — at the
      institution-specific subdomain iitkgp.irins.org. The profiles, publications and affiliations
      are IIT Kharagpur's; the platform, the software and any contract are INFLIBNET's, and no
      IRINS specification is stored in this repository. Verified 2026-09-01: iitkgp.irins.org
      returns HTTP 403 with a Cloudflare "Just a moment..." challenge to every automated client,
      including one sending a full Chrome header set, as does irins.org itself. That is a live host
      refusing automation, not a dead one, so no machine-readable surface behind it could be
      assessed and INFLIBNET's platform-level claims of ORCID, Scopus and Crossref ingestion are
      recorded as unverified rather than credited to the institution.
    humanURL: https://iitkgp.irins.org/
