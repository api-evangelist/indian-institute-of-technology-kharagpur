  - aid: indian-institute-of-technology-kharagpur:erp-cep-brochures
    name: IIT Kharagpur ERP Continuing Education Programme Brochure Endpoint
    x-operator: institution
    description: >-
      The only unauthenticated endpoint on the IIT Kharagpur estate that the institute wrote
      itself. The ERP at erp.iitkgp.ac.in is a JAX-RS application on Apache Tomcat 8.0.51 behind a
      bespoke session SSO — /InfoCellDetails/resources/application.wadl 302s to
      /SSOAdministration/login.htm and /InfoCellDetails/ returns 403 — but one resource namespace,
      /InfoCellDetails/resources/external/, is deliberately open, and the institute's own homepage
      links a single operation in it, cepdata, two hundred times, once per Continuing Education
      Programme course. GET with a structured course_id returns the course brochure as
      application/pdf with no key, cookie or Referer required. Verified live 2026-09-01 against
      eight course_id values: five returned PDFs of 74 KB to 2.25 MB, three returned HTTP 200 with
      Content-Type text/plain and a zero-byte body, which is also the response to an unknown
      course_id and to no course_id at all — there is no 404. Accept: application/json returns 406
      with a Tomcat error page. This is a real course-catalog surface, small and undocumented, and
      it is institution engineering rather than a vendor's.
    humanURL: https://www.iitkgp.ac.in/
    baseURL: https://erp.iitkgp.ac.in/InfoCellDetails/resources/external/cepdata
