x-coverage:
  state: covered
  reason: covered
  detail: >-
    Two institution-operated machine surfaces were found and verified live on 2026-09-01, neither
    of them documented by the institute: an OpenSearch 1.1 / Atom query interface over the
    self-hosted DSpace 6.0 Institutional Digital Repository at www.idr.iitkgp.ac.in, and a public
    JAX-RS document endpoint in the institute's own ERP at
    erp.iitkgp.ac.in/InfoCellDetails/resources/external/cepdata that the homepage links 200 times.
    Both are unauthenticated and both are described here from probed behaviour, marked derived. Two
    vendor platforms are recorded as tenant relationships rather than as IIT Kharagpur contracts —
    IRINS/INFLIBNET (iitkgp.irins.org) and AlmaConnect (alumni.iitkgp.ac.in, a CNAME to an S3
    website) — and no vendor spec is stored. One registry membership is evidenced: ROR 03w5sq511.
    The absences are as measured as the presences. There is no OAI-PMH provider: six conventional
    base URLs return 404 and the nginx front end proxies only /xmlui, so the repository cannot be
    harvested by OpenAIRE, BASE or Shodhganga. There is no Shibboleth or SAML identity provider for
    iitkgp.ac.in anywhere in the 10,616-entity eduGAIN export, including the 379 entities
    contributed by India's own INFED federation where peer IITs such as IIT Hyderabad are
    registered; idp., sso., shibboleth. and parichay.iitkgp.ac.in do not resolve. DataCite returns
    zero providers and zero clients for Kharagpur, Crossref zero members, and the repository's
    handle prefix is the DSpace installation default 123456789 — so repository items carry no
    persistent identifier at all. Of the twelve education-regime domain standards, none is met; the
    conformance file records each with the negative probe that established it, alongside four
    non-regime standards that are met (OpenSearch 1.1, Atom 1.0, Dublin Core, ROR). No developer
    portal, no OpenAPI, no key issuance, no status page, no changelog and no .well-known directory
    exist. www.iitkgp.ac.in is an Angular SPA that returns HTTP 200 with a 47,510-byte shell for
    /llms.txt, /.well-known/security.txt, /sitemap.xml, /privacy-policy and /terms-of-use alike:
    every one is a soft 404 and none is credited. The only privacy policy published anywhere on the
    estate is the HPC facility's, at hpc.iitkgp.ac.in/privacy-policy. Student records, timetabling,
    enrolment and HPC allocation sit behind session SSO — the ERP's JAX-RS WADL exists but 302s to
    a login page — and were not probeable. No support or helpdesk pointer is emitted: helpdesk. and support.iitkgp.ac.in do not resolve, /contact-us is another soft 404, and cic.iitkgp.ac.in serves a 529-byte SPA shell on every path.
