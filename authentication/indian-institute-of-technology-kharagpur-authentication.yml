description: >-
  Authentication posture across IIT Kharagpur's surfaces. There is no API key issuance, no OAuth
  authorization server, no OpenID Connect discovery document and no published SAML metadata
  anywhere on the institute's public estate. The two callable surfaces recorded in this profile
  are entirely unauthenticated; everything else is behind an institute-built session SSO that is
  not federated and not documented.
summary:
  types: [none, session]
